version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: saista-mysql
    command: --performance-schema=OFF --innodb-buffer-pool-size=64M --innodb-log-buffer-size=1M
    environment:
      MYSQL_ROOT_PASSWORD: Asad@1234
      MYSQL_DATABASE: saista_bakers
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pAsad@1234"]
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - saista-network
    restart: unless-stopped

  # SMTP Server (for email notifications)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: saista-mailhog
    networks:
      - saista-network
    restart: unless-stopped

  # User Service
  user-service:
    image: asadoblivion/saista-user-service:latest
    build:
      context: ./user-service
      dockerfile: ../docker/Dockerfile.user-service
    container_name: saista-user-service
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Asad@1234
      DB_NAME: saista_bakers
      DB_PORT: 3306
      SECRET_KEY: saista-bakers-secret-key-2024-production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - saista-network
    restart: unless-stopped

  # Order Service
  order-service:
    image: asadoblivion/saista-order-service:latest
    build:
      context: ./order-service
      dockerfile: ../docker/Dockerfile.order-service
    container_name: saista-order-service
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Asad@1234
      DB_NAME: saista_bakers
      DB_PORT: 3306
      SECRET_KEY: saista-bakers-secret-key-2024-production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - saista-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    image: asadoblivion/saista-payment-service:latest
    build:
      context: ./payment-service
      dockerfile: ../docker/Dockerfile.payment-service
    container_name: saista-payment-service
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Asad@1234
      DB_NAME: saista_bakers
      DB_PORT: 3306
      SECRET_KEY: saista-bakers-secret-key-2024-production
      ORDER_SERVICE_URL: http://order-service:5002
      USER_SERVICE_URL: http://user-service:5001
      SMTP_SERVER: mailhog
      SMTP_PORT: 1025
      SENDER_EMAIL: noreply@saistabakers.com
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - saista-network
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    image: asadoblivion/saista-frontend:latest
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: saista-frontend
    environment:
      REACT_APP_USER_SERVICE_URL: /api/users
      REACT_APP_ORDER_SERVICE_URL: /api/orders
      REACT_APP_PAYMENT_SERVICE_URL: /api/payment
    ports:
      - "80:80"  # ONLY expose the frontend to the outside world
    depends_on:
      - user-service
      - order-service
      - payment-service
    networks:
      - saista-network
    restart: unless-stopped

networks:
  saista-network:
    driver: bridge

volumes:
  mysql_data:
