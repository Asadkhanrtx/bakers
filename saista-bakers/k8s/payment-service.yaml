apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: saista-payment-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5003
        envFrom:
        - secretRef:
            name: db-secrets
        - configMapRef:
            name: app-config
        env:
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smtp-secrets
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - port: 5003
    targetPort: 5003
